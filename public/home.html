<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Zfox_fc Home</title>
    <style>
        body { background-color: #0d1117; color: white; margin: 0; padding-bottom: 80px; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* 🔥 স্টোর বাটন এনিমেশন */
        .fire-wrapper { position: relative; width: 60px; height: 60px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        .flame {
            position: absolute; bottom: 15px; width: 35px; height: 35px;
            background: radial-gradient(circle, #ffcc00 20%, #ff4500 60%, rgba(255, 69, 0, 0) 80%);
            border-radius: 50% 50% 20% 50%; transform: rotate(-45deg);
            filter: blur(2px); animation: burn 0.4s infinite alternate;
            box-shadow: 0 0 15px #ff4500; z-index: 1;
        }
        @keyframes burn { 0% { transform: rotate(-45deg) scale(1); opacity: 0.8; } 100% { transform: rotate(-45deg) scale(1.2); opacity: 1; } }
        .store-btn-box { position: relative; z-index: 5; background: rgba(22, 27, 34, 0.9); border: 1px solid #ff4500; border-radius: 10px; padding: 4px 8px; text-align: center; }

        /* 💎 ব্যালেন্স বক্স ডিজাইন */
        .balance-container { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .premium-box {
            background: #161b22; padding: 5px 12px; border-radius: 12px; border: 1px solid #30363d;
            display: flex; align-items: center; gap: 8px; min-width: 100px; justify-content: space-between;
        }
        .diamond-border { border-color: #58a6ff; box-shadow: 0 0 8px rgba(88, 166, 255, 0.2); }
        .gold-border { border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.2); }
        .add-btn { background: #58a6ff; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; }

        /* 📋 টুর্নামেন্ট কার্ড ও ডিজাইন */
        .match-card { background: #161b22; border-radius: 15px; border: 1px solid #30363d; margin-bottom: 20px; overflow: hidden; position: relative; }
        .match-banner { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #30363d; }
        .card-content { padding: 15px; }
        .timer-badge { position: absolute; top: 10px; right: 10px; font-size: 11px; background: rgba(0, 0, 0, 0.7); color: #ffcc00; padding: 4px 8px; border-radius: 5px; border: 1px solid #ffcc00; font-weight: bold; z-index: 10; }
        
        #detailsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: #161b22; width: 85%; max-width: 400px; border-radius: 20px; border: 1px solid #58a6ff; padding: 20px; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .detail-item { background: #0d1117; padding: 10px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #ff4500; font-size: 14px; }
        .applied-tag { color: #238636; font-weight: bold; font-size: 13px; border: 1px solid #238636; padding: 8px 15px; border-radius: 8px; background: rgba(35, 134, 54, 0.1); }
        .full-tag { color: #f85149; font-weight: bold; font-size: 14px; border: 1px solid #f85149; padding: 8px 15px; border-radius: 8px; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #30363d; z-index: 100; }
        .nav-btn { background:none; border:none; color:gray; cursor:pointer; font-size: 14px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color:#58a6ff; font-weight:bold; }
        
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    </style>
</head>
<body>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user || !user.gameId) { window.location.href = 'index.html'; }
    </script>

    <div style="padding: 10px 15px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid #30363d; position: sticky; top:0; background:#0d1117; z-index:90;">
        <div class="fire-wrapper" onclick="location.href='store.html'">
            <div class="flame"></div>
            <div class="store-btn-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <div style="font-size: 8px; color: #ffcc00; font-weight: bold;">STORE</div>
            </div>
        </div>

        <h3 style="color: #58a6ff; letter-spacing: 1px; margin: 0; font-weight: 800; font-size: 15px;">Zfox_Fc 🏆26</h3>
        
        <div class="balance-container">
            <div class="premium-box diamond-border">
                 <span style="font-size: 13px; font-weight: bold; color: white;">💎 <span id="userCoins">0</span></span>
                <a href="redeem.html" class="add-btn">
                    <svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M8 3V13M3 8H13" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>
                </a>
            </div>
            <div class="premium-box gold-border" onclick="location.href='game.html'" style="cursor: pointer;">
                 <span style="font-size: 13px; font-weight: bold; color: #ffcc00;">🪙 <span id="userIQ">0</span></span>
                 <span style="font-size: 9px; color: gray; font-weight: bold;">IQ</span>
            </div>
        </div>
    </div>

    <div style="padding: 20px;">
        <h2 style="font-size: 18px; border-left: 4px solid #58a6ff; padding-left: 10px; margin-bottom: 20px;">Live Tournaments</h2>
        <div id="tournamentList">
            <p style="text-align: center; color: gray;">Loading Matches...</p>
        </div>
    </div>

    <div id="detailsModal">
        <div class="modal-card">
            <h2 id="mTitle" style="color: #58a6ff; margin-top: 0; font-size: 20px;"></h2>
            <div class="detail-item">🗺️ <b>Map:</b> <span id="mMap"></span></div>
            <div class="detail-item">⏰ <b>Time (BD):</b> <span id="mTime"></span></div>
            <div class="detail-item">🏆 <b>Prize:</b> <span id="mPrize"></span></div>
            <div class="detail-item">📜 <b>Rules:</b> <span id="mRules"></span></div>
            <div style="margin-top: 25px; display: flex; gap: 10px;">
                <button onclick="closeM()" style="flex:1; padding:12px; background:#30363d; color:white; border:none; border-radius:10px; cursor:pointer;">Back</button>
                <button id="joinConfirmBtn" style="flex:2; padding:12px; background:linear-gradient(45deg, #238636, #2ea043); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Confirm Join</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="inbox.html" class="nav-btn"><span>📧</span><span>Inbox</span></a>
        <a href="home.html" class="nav-btn active"><span>🏠</span><span>Home</span></a>
        <a href="account.html" class="nav-btn"><span>👤</span><span>Account</span></a>
    </div>
    
    <script>
        document.getElementById('userCoins').innerText = user.coins || 0;
        document.getElementById('userIQ').innerText = user.iq_balance || 0;

        let allPackages = [];
        let timers = [];

        // ডাটা সিঙ্ক ফাংশন
        async function syncData() {
            try {
                const res = await fetch(`/api/get-packages?gameId=${user.gameId}`);
                if (!res.ok) throw new Error("Fetch failed");
                const data = await res.json();
                allPackages = data.packages;
                document.getElementById('userCoins').innerText = data.coins;
                document.getElementById('userIQ').innerText = data.iq_balance || 0;
                renderMatches(data.joinedPackages || []);
            } catch (err) { console.error("Sync Error:", err); }
        }

        // --- স্মার্ট ব্যানার ফাংশন (Session Controlled) ---
        async function fetchBannerFromSheet() {
            // যদি ইউজার এই সেশনে একবার ব্যানার কেটে দেয়, তবে আর চেক করবে না
            if (sessionStorage.getItem('bannerDismissed') === 'true') return;

            try {
                const sheetUrl = "https://docs.google.com/spreadsheets/d/1jrwIZvzegH-bHAZx1SVCCzgn10HHLpFy2sEltx9PrUM/gviz/tq?tqx=out:csv&sheet=sheet1";
                const response = await fetch(sheetUrl);
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '')));
                
                const status = rows[1][0];
                const imageUrl = rows[1][1];
                const linkUrl = rows[1][2];

                if (status === "active") {
                    showBannerPopup(imageUrl, linkUrl);
                }
            } catch (error) { console.log("Banner fetch error"); }
        }

        function showBannerPopup(img, link) {
            // যদি অলরেডি পপআপ স্ক্রিনে থাকে, তবে আবার বানাবে না
            if(document.getElementById('sheetBannerPopup')) return;
            
            const bannerHtml = `
            <div id="sheetBannerPopup" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:10000; display:flex; justify-content:center; align-items:center;">
                <div style="position:relative; width:85%; max-width:320px; border-radius:15px; border:2px solid #ffcc00; box-shadow:0 0 25px rgba(255, 204, 0, 0.4); overflow:hidden; background:#161b22; animation: pop 0.4s ease-out;">
                    
                    <button onclick="dismissBanner()" 
                        style="position:absolute; top:8px; right:8px; background:rgba(248, 81, 73, 0.9); color:white; border:none; width:26px; height:26px; border-radius:50%; font-weight:bold; cursor:pointer; z-index:10001; font-size:12px; display:flex; align-items:center; justify-content:center;">✕</button>
                    
                    <img src="${img}" onclick="if('${link}') window.location.href='${link}'" style="width:100%; display:block; cursor:pointer;">
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', bannerHtml);
        }

        function dismissBanner() {
            const popup = document.getElementById('sheetBannerPopup');
            if (popup) popup.remove();
            // সেশনে সেভ করে রাখা যাতে এইবার আর না দেখায়
            sessionStorage.setItem('bannerDismissed', 'true');
        }

        // বাকি টুর্নামেন্ট লজিক
        function renderMatches(joinedIds) {
            const list = document.getElementById('tournamentList');
            list.innerHTML = "";
            timers.forEach(t => clearInterval(t));

            allPackages.forEach((pkg, index) => {
                if (pkg.Title.toLowerCase().includes("ludo")) return;
                const isJoined = joinedIds.includes(pkg.Match_ID) || joinedIds.includes(pkg.Title);
                const total = parseInt(pkg.Total_Slots) || 48;
                const joined = parseInt(pkg.Joined_Players) || 0;
                const isFull = joined >= total;
                const timerId = `timer-${index}`;
                const matchImg = pkg.img || "https://placehold.co/600x300/161b22/58a6ff?text=No+Image";
                const isGame = pkg.Type === "Game";
                
                const actionButton = isGame 
                    ? `<button onclick="window.location.href='game.html'" style="background:linear-gradient(45deg, #58a6ff, #00d2fc); color:white; border:none; padding:10px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">PLAY NOW</button>`
                    : (isJoined ? `<span class="applied-tag">Applied ✅</span>` : (isFull ? `<span class="full-tag">FULL 🚫</span>` : `<button onclick="openM('${pkg.Match_ID || pkg.Title}')" style="background:linear-gradient(45deg, #238636, #2ea043); color:white; border:none; padding:10px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">JOIN NOW</button>`));

                list.innerHTML += `
                    <div class="match-card">
                        ${!isGame ? `<div id="${timerId}" class="timer-badge">Loading...</div>` : `<div class="timer-badge" style="color:#00d2fc; border-color:#00d2fc;">Play Anytime</div>`}
                        <img src="${matchImg}" class="match-banner" alt="Game Image">
                        <div class="card-content">
                            <h3 style="margin: 0; color: #58a6ff;">${pkg.Title}</h3>
                            <p style="font-size: 12px; color: gray; margin: 8px 0;">
                                ${isGame ? `🎮 Interactive Minesweeper Game` : `👥 Players: <span style="color:white; font-weight:bold;">${joined}/${total}</span>`}
                            </p>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                                <div style="font-weight:bold; color:#fff; font-size: 15px;">Min: ${pkg.Fee} 💎</div>
                                ${actionButton}
                            </div>
                        </div>
                    </div>`;
                if (!isGame && pkg.Time) startTimer(pkg.Time, timerId);
            });
        }

        function startTimer(targetTime, elementId) {
            function update() {
                const now = new Date();
                const bdNow = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3600000 * 6));
                const diff = new Date(targetTime).getTime() - bdNow.getTime();
                const el = document.getElementById(elementId);
                if (!el) return;
                if (diff <= 0) { el.innerText = "Ongoing / Closed"; el.style.color = "#ff7b72"; return; }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                el.innerText = `Starts in: ${d}d ${h}h ${m}m ${s}s`;
            }
            update();
            const t = setInterval(update, 1000);
            timers.push(t);
        }

        function openM(id) {
            const pkg = allPackages.find(p => (p.Match_ID === id || p.Title === id));
            if(!pkg) return;
            document.getElementById('mTitle').innerText = pkg.Title;
            document.getElementById('mMap').innerText = pkg.Map || "TBA";
            document.getElementById('mTime').innerText = pkg.Time || "TBA";
            document.getElementById('mPrize').innerText = pkg.Prize_Pool || "Double Win";
            document.getElementById('mRules').innerText = pkg.Rules || "No Cheating!";
            const joinBtn = document.getElementById('joinConfirmBtn');
            joinBtn.disabled = false; joinBtn.innerText = "Confirm Join";
            joinBtn.onclick = () => processJoin(pkg);
            document.getElementById('detailsModal').style.display = 'flex';
        }

        async function processJoin(pkg) {
            const btn = document.getElementById('joinConfirmBtn');
            btn.disabled = true; btn.innerText = "Joining...";
            try {
                const res = await fetch('/api/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: user.gameId, fee: pkg.Fee, packageName: pkg.Title, matchId: pkg.Match_ID || "", userName: user.name })
                });
                if (res.ok) { alert("Tournament Joined Successfully! ✅"); window.location.reload(); }
                else { alert("Join failed!"); btn.disabled = false; btn.innerText = "Confirm Join"; }
            } catch (e) { alert("Error!"); btn.disabled = false; }
        }

        function closeM() { document.getElementById('detailsModal').style.display = 'none'; }

        // ১০ সেকেন্ড পর পর চেক
        setInterval(() => {
            syncData();
            fetchBannerFromSheet();
        }, 10000);

        syncData();
        setTimeout(fetchBannerFromSheet, 3000);
    </script>
</body>
</html>
