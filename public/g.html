<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Explore - Zfox_fc</title>
    <style>
        body { background-color: #0d1117; color: white; margin: 0; padding-bottom: 80px; font-family: 'Segoe UI', sans-serif; }
        .match-card { background: #161b22; padding: 18px; border-radius: 15px; border: 1px solid #30363d; margin-bottom: 15px; position: relative; }
        .timer-badge { position: absolute; top: 10px; right: 10px; font-size: 11px; background: rgba(255, 204, 0, 0.1); color: #ffcc00; padding: 4px 8px; border-radius: 5px; border: 1px solid #ffcc00; }
        #detailsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: #161b22; width: 85%; max-width: 400px; border-radius: 20px; border: 1px solid #58a6ff; padding: 20px; }
        .detail-item { background: #0d1117; padding: 10px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid #ff4500; font-size: 14px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #30363d; }
        .nav-btn { color:gray; text-decoration: none; font-size: 14px; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <div style="padding: 15px; text-align: center; border-bottom: 1px solid #30363d; background:#0d1117; position: sticky; top:0; z-index:100;">
        <h3 style="color: #58a6ff; margin: 0;">Zfox_Fc 🏆 (Guest)</h3>
    </div>

    <div style="padding: 20px;">
        <h2 style="font-size: 18px; border-left: 4px solid #58a6ff; padding-left: 10px;">Available Matches</h2>
        <div id="tournamentList"><p style="text-align: center; color: gray;">Loading...</p></div>
    </div>

    <div id="detailsModal">
        <div class="modal-card">
            <h2 id="mTitle" style="color: #58a6ff;"></h2>
            <div class="detail-item">🗺️ Map: <span id="mMap"></span></div>
            <div class="detail-item">🏆 Prize: <span id="mPrize"></span></div>
            <div class="detail-item">📜 Rules: <span id="mRules"></span></div>
            <div style="margin-top: 25px; display: flex; gap: 10px;">
                <button onclick="closeM()" style="flex:1; padding:12px; background:#30363d; color:white; border:none; border-radius:10px;">Back</button>
                <button onclick="goToLogin()" style="flex:2; padding:12px; background:linear-gradient(45deg, #238636, #2ea043); color:white; border:none; border-radius:10px; font-weight:bold;">Login to Join</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-btn"><span>🔑</span><span>Login</span></a>
        <a href="register.html" class="nav-btn"><span>📝</span><span>Register</span></a>
    </div>

    <script>
        let allPackages = [];
        async function loadMatches() {
            const res = await fetch('/api/g');
            const data = await res.json();
            allPackages = data.packages;
            const list = document.getElementById('tournamentList');
            list.innerHTML = "";
            allPackages.forEach(pkg => {
                list.innerHTML += `
                    <div class="match-card" onclick="openM('${pkg.Title}')">
                        <div class="timer-badge">Upcoming</div>
                        <h3 style="color: #58a6ff;">${pkg.Title}</h3>
                        <p>Fee: ${pkg.Fee} 🪙</p>
                        <button style="background:#238636; color:white; border:none; padding:8px 15px; border-radius:5px; width:100%;">View Details</button>
                    </div>`;
            });
        }
        function openM(title) {
            const pkg = allPackages.find(p => p.Title === title);
            document.getElementById('mTitle').innerText = pkg.Title;
            document.getElementById('mMap').innerText = pkg.Map || "Bermuda";
            document.getElementById('mPrize').innerText = pkg.Prize_Pool;
            document.getElementById('mRules').innerText = pkg.Rules || "No Cheating!";
            document.getElementById('detailsModal').style.display = 'flex';
        }
        function closeM() { document.getElementById('detailsModal').style.display = 'none'; }
        function goToLogin() { alert("লগইন না করলে টুর্নামেন্টে জয়েন করতে পারবেন না!"); window.location.href = 'index.html'; }
        loadMatches();
    </script>
</body>
          </html>
