<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zfox_fc Guest Home</title>
    <style>
        /* আপনার home.html এর CSS হুবহু এখানে থাকবে */
        body { background-color: #0d1117; color: white; margin: 0; padding-bottom: 80px; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .header { background: #161b22; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .coin-box { background: #0d1117; padding: 5px 12px; border-radius: 20px; border: 1px solid #f1e05a; color: #f1e05a; font-weight: bold; font-size: 14px; }
        .container { padding: 15px; }
        .match-card { background: #161b22; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #30363d; }
        .match-title { font-size: 18px; color: #58a6ff; font-weight: bold; margin-bottom: 5px; }
        .match-details { font-size: 13px; color: #8b949e; margin-bottom: 10px; }
        .join-btn { width: 100%; background: linear-gradient(90deg, #238636, #2ea043); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* প্রোফাইল সেকশন */
        .guest-profile { background: #1c2128; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 4px solid #58a6ff; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-item { background: #0d1117; padding: 10px; border-radius: 5px; text-align: center; font-size: 12px; color: #8b949e; }
        .stat-val { display: block; font-size: 16px; color: white; font-weight: bold; }

        /* মডেল স্টাইল */
        #detailsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #161b22; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div style="font-weight: bold; color: #58a6ff;" id="displayGuestName">Guest...</div>
        </div>
        <div class="coin-box">🪙 <span id="displayGuestCoins">0</span></div>
    </div>

    <div class="container">
        <div class="guest-profile">
            <div style="font-size: 14px; color: #8b949e;">Welcome, <span id="pName" style="color: white; font-weight: bold;">Guest</span></div>
            <div style="font-size: 12px; color: #58a6ff; margin-bottom: 5px;" id="pID">ID: G-0000</div>
            
            <div class="stat-grid">
                <div class="stat-item">Matches Played <span class="stat-val" id="pPlayed">0</span></div>
                <div class="stat-item">Matches Won <span class="stat-val" id="pWon">0</span></div>
            </div>
        </div>

        <h3 style="margin-bottom: 15px; color: #c9d1d9;">Available Matches</h3>
        <div id="matchList">Loading packages...</div>
    </div>

    <div id="detailsModal">
        <div class="modal-content">
            <h2 id="mTitle" style="color: #58a6ff;"></h2>
            <p id="mRules" style="font-size: 13px; color: #8b949e;"></p>
            <button id="joinConfirmBtn" class="join-btn">PLAY NOW</button>
            <button onclick="closeM()" style="background:transparent; border:none; color:gray; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        // ১. গেস্ট ডাটা ম্যানেজমেন্ট (LocalStorage)
        function getGuestData() {
            let data = localStorage.getItem('guest_user');
            if (!data) {
                // নতুন গেস্ট তৈরি
                const randomId = Math.floor(1000 + Math.random() * 9000);
                const newData = {
                    name: "Guest_" + randomId,
                    gameId: "G-" + randomId,
                    coins: 100, // ডিফল্ট ১০০ কয়েন
                    played: 0,
                    won: 0,
                    inbox: []
                };
                localStorage.setItem('guest_user', JSON.stringify(newData));
                return newData;
            }
            return JSON.parse(data);
        }

        const guest = getGuestData();

        // UI আপডেট
        function updateUI() {
            document.getElementById('displayGuestName').innerText = guest.name;
            document.getElementById('displayGuestCoins').innerText = guest.coins;
            document.getElementById('pName').innerText = guest.name;
            document.getElementById('pID').innerText = "ID: " + guest.gameId;
            document.getElementById('pPlayed').innerText = guest.played;
            document.getElementById('pWon').innerText = guest.won;
        }

        // ২. প্যাকেজ লোড করা (api/get-packages.js ব্যবহার করে)
        async function fetchPackages() {
            try {
                // এখানে আপনার এপিআই কল করা হচ্ছে
                const res = await fetch('/api/get-packages');
                const data = await res.json();
                
                if (data.packages) {
                    renderMatches(data.packages);
                }
            } catch (err) {
                document.getElementById('matchList').innerText = "Failed to load matches.";
            }
        }

        function renderMatches(packages) {
            const list = document.getElementById('matchList');
            list.innerHTML = "";
            packages.forEach(pkg => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-title">${pkg.Title}</div>
                    <div class="match-details">Entry Fee: 🪙 ${pkg.Fee} | Prize: 🪙 ${pkg.Prize}</div>
                    <div style="font-size: 11px; color: #238636; margin-bottom: 10px;">Status: LIVE ✅</div>
                    <button class="join-btn" onclick='showJoinModal(${JSON.stringify(pkg)})'>JOIN MATCH</button>
                `;
                list.appendChild(card);
            });
        }

        // ৩. জয়েন লজিক
        let selectedPkg = null;
        function showJoinModal(pkg) {
            selectedPkg = pkg;
            document.getElementById('mTitle').innerText = pkg.Title;
            document.getElementById('mRules').innerText = pkg.Rules || "Play fair and win big!";
            document.getElementById('detailsModal').style.display = 'flex';
        }

        document.getElementById('joinConfirmBtn').onclick = function() {
            if (guest.coins >= parseInt(selectedPkg.Fee)) {
                // গেম পেজে পাঠিয়ে দেওয়া (gameg.html)
                // সাথে প্যাকেজ ডাটা পাস করা
                sessionStorage.setItem('currentMatch', JSON.stringify(selectedPkg));
                window.location.href = 'gameg.html';
            } else {
                alert("আপনার পর্যাপ্ত কয়েন নেই! গেস্ট মোডে আপনি কয়েন হ্যাক করে বাড়িয়ে নিতে পারেন (LocalStorage edit)।");
            }
        };

        function closeM() { document.getElementById('detailsModal').style.display = 'none'; }

        // পেজ লোড হলে রান হবে
        updateUI();
        fetchPackages();
    </script>
</body>
</html>
