<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Zfox_fc Home (Guest Mode)</title>
    <style>
        /* তোমার home.html থেকে হুবহু কপি করা ডিজাইন */
        body { background-color: #0d1117; color: white; margin: 0; padding-bottom: 80px; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* 🔥 স্টোর বাটন এনিমেশন */
        .fire-wrapper { position: relative; width: 60px; height: 60px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
        .flame {
            position: absolute; bottom: 15px; width: 35px; height: 35px;
            background: radial-gradient(circle, #ffcc00 20%, #ff4500 60%, rgba(255, 69, 0, 0) 80%);
            border-radius: 50% 50% 20% 50%; transform: rotate(-45deg);
            filter: blur(2px); animation: burn 0.4s infinite alternate;
            box-shadow: 0 0 15px #ff4500; z-index: 1;
        }
        @keyframes burn { 0% { transform: rotate(-45deg) scale(1); opacity: 0.8; } 100% { transform: rotate(-45deg) scale(1.2); opacity: 1; } }
        
        .store-btn-box { position: relative; z-index: 5; background: rgba(22, 27, 34, 0.9); border: 1px solid #ff4500; border-radius: 10px; padding: 4px 8px; text-align: center; }

        .balance-container { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .premium-box {
            background: #161b22; padding: 5px 12px; border-radius: 12px; border: 1px solid #30363d;
            display: flex; align-items: center; gap: 8px; min-width: 100px; justify-content: space-between;
        }
        .diamond-border { border-color: #58a6ff; box-shadow: 0 0 8px rgba(88, 166, 255, 0.2); }
        .gold-border { border-color: #ffcc00; box-shadow: 0 0 8px rgba(255, 204, 0, 0.2); cursor: default; }
        
        .add-btn { background: #58a6ff; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: bold; color: white; font-size: 12px; }

        .banner-slider { width: 100%; height: 180px; overflow: hidden; position: relative; margin-top: 15px; border-radius: 15px; border: 1px solid #30363d; }
        .banner-track { display: flex; transition: transform 0.5s ease-in-out; }
        .banner-track img { width: 100%; height: 180px; flex-shrink: 0; object-fit: cover; }

        .match-card { background: #161b22; border-radius: 15px; border: 1px solid #30363d; margin-bottom: 20px; overflow: hidden; position: relative; }
        .match-banner { width: 100%; height: 160px; object-fit: cover; border-bottom: 1px solid #30363d; }
        .card-content { padding: 15px; }
        .timer-badge { position: absolute; top: 10px; right: 10px; font-size: 11px; background: rgba(0, 0, 0, 0.7); color: #ffcc00; padding: 4px 8px; border-radius: 5px; border: 1px solid #ffcc00; font-weight: bold; z-index: 10; }

        /* ডেইলি বোনাস মডাল */
        #rewardModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: #161b22; width: 85%; max-width: 350px; border-radius: 20px; border: 1px solid #58a6ff; padding: 25px; text-align: center; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .claim-btn { background: linear-gradient(45deg, #ffcc00, #ff4500); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 20px; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #30363d; z-index: 100; }
        .nav-btn { background:none; border:none; color:gray; cursor:pointer; font-size: 14px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color:#58a6ff; font-weight:bold; }
    </style>
</head>
<body>

    <div id="rewardModal">
        <div class="modal-card">
            <div style="font-size: 50px;">🎁</div>
            <h2 style="color: #ffcc00;">Daily Gift!</h2>
            <p style="color: #abb2bf;">গেস্ট ইউজার হিসেবে আজ আপনি পাচ্ছেন:</p>
            <div style="background: #0d1117; padding: 15px; border-radius: 12px; border: 1px dashed #58a6ff;">
                <div style="color: #fff; font-size: 18px;">💎 100 Diamonds</div>
                <div style="color: #ffcc00; font-size: 18px;">🪙 200 IQ Gold</div>
            </div>
            <button class="claim-btn" onclick="claimReward()">Claim Now</button>
        </div>
    </div>

    <div style="padding: 10px 15px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 1px solid #30363d; position: sticky; top:0; background:#0d1117; z-index:90;">
        <div class="fire-wrapper" onclick="location.href='storeg.html'">
            <div class="flame"></div>
            <div class="store-btn-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <div style="font-size: 8px; color: #ffcc00; font-weight: bold;">STORE</div>
            </div>
        </div>
        <h3 style="color: #58a6ff; letter-spacing: 1px; margin: 0; font-weight: 800; font-size: 15px;">Zfox_fc Guest</h3>
        <div class="balance-container">
            <div class="premium-box diamond-border">
                 <span style="font-size: 13px; font-weight: bold; color: white;">💎 <span id="uCoins">0</span></span>
                 <a href="add-moneyg.html" class="add-btn">+</a>
            </div>
            <div class="premium-box gold-border">
                 <span style="font-size: 13px; font-weight: bold; color: #ffcc00;">🪙 <span id="uIQ">0</span></span>
            </div>
        </div>
    </div>

    <div style="padding: 0 15px;">
        <div class="banner-slider">
            <div class="banner-track" id="bannerTrack">
                <img src="https://placehold.co/600x200/161b22/58a6ff?text=Welcome+Guest" alt="Banner 1">
            </div>
        </div>

        <h2 style="font-size: 18px; border-left: 4px solid #58a6ff; padding-left: 10px; margin: 20px 0;">Available Packages</h2>
        <div id="pkgList"></div>
    </div>

    <div class="bottom-nav">
        <a href="inboxg.html" class="nav-btn">📧<span>Inbox</span></a>
        <a href="g.html" class="nav-btn active">🏠<span>Home</span></a>
        <a href="accountg.html" class="nav-btn">👤<span>Account</span></a>
    </div>

    <script>
        // --- লোকাল স্টোরেজ ইঞ্জিন ---
        let guest = JSON.parse(localStorage.getItem('g_data')) || { coins: 0, iq: 0, last: '', inbox: [] };

        function updateBal() {
            document.getElementById('uCoins').innerText = guest.coins;
            document.getElementById('uIQ').innerText = guest.iq;
        }

        window.onload = () => {
            const today = new Date().toDateString();
            if (guest.last !== today) {
                document.getElementById('rewardModal').style.display = 'flex';
            }
            updateBal();
            loadPkgs();
        };

        function claimReward() {
            guest.coins += 100;
            guest.iq += 200;
            guest.last = new Date().toDateString();
            guest.inbox.unshift({ t: "System", m: "আপনি ১০০ হীরা এবং ২০০ আইকিউ সোনা পেয়েছেন!", d: new Date().toLocaleString() });
            save();
            document.getElementById('rewardModal').style.display = 'none';
            updateBal();
        }

        async function loadPkgs() {
            try {
                const res = await fetch('/api/get-packages');
                const data = await res.json();
                const list = document.getElementById('pkgList');
                list.innerHTML = "";

                data.packages.forEach((pkg, idx) => {
                    const isGame = pkg.Title.toLowerCase().includes("ludo") || pkg.Title.toLowerCase().includes("game");
                    const btnLabel = isGame ? "PLAY NOW" : "JOIN NOW";
                    const btnFunc = isGame ? `goGame('${pkg.Title}')` : `goLogin()`;
                    const btnBg = isGame ? "linear-gradient(45deg, #238636, #2ea043)" : "#30363d";

                    list.innerHTML += `
                        <div class="match-card">
                            <div class="timer-badge">${pkg.Time || 'Daily'}</div>
                            <img src="${pkg.img || 'https://placehold.co/600x300/161b22/58a6ff?text=Match'}" class="match-banner">
                            <div class="card-content">
                                <h3 style="margin: 0; color: #58a6ff;">${pkg.Title}</h3>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                                    <div style="font-weight:bold;">Entry: ${pkg.Fee} 💎</div>
                                    <button onclick="${btnFunc}" style="background:${btnBg}; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">${btnLabel}</button>
                                </div>
                            </div>
                        </div>`;
                });
            } catch(e) { console.error("Error loading"); }
        }

        function goLogin() { alert("🔒 এটি টুর্নামেন্ট! জয়েন করতে আসল একাউন্টে লগইন করুন।"); }

        function goGame(name) {
            guest.inbox.unshift({ t: "Game Join", m: `${name} গেমে আপনি সফলভাবে জয়েন করেছেন।`, d: new Date().toLocaleString() });
            save();
            alert("Success! Redirecting to game... ✅");
            window.location.href = "gameg.html";
        }

        function save() { localStorage.setItem('g_data', JSON.stringify(guest)); }

        // ব্যানার স্লাইডার এনিমেশন (home.html এর মতো)
        let slideIdx = 0;
        setInterval(() => {
            const track = document.getElementById('bannerTrack');
            if(track) {
                slideIdx = (slideIdx + 1) % track.children.length;
                track.style.transform = `translateX(-${slideIdx * 100}%)`;
            }
        }, 3000);
    </script>
</body>
</html>
