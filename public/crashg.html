<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Rocket Crash - Fresh</title>
    <style>
        :root { --primary: #00d4ff; --danger: #ff4d4d; --success: #00ff88; --gold: #f1e05a; --bg: #010409; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        
        .game-container { max-width: 400px; margin: 20px auto; background: #0d1117; padding: 25px; border-radius: 24px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .balance-bar { display: flex; justify-content: space-around; margin-bottom: 15px; font-weight: bold; color: var(--gold); background: #161b22; padding: 12px; border-radius: 12px; border: 1px solid #30363d; }

        #game-window { 
            height: 380px; background: radial-gradient(circle at bottom, #161b22 0%, #010409 100%); 
            border-radius: 20px; position: relative; overflow: hidden; border: 1px solid #30363d;
        }

        #multiplier { font-size: 55px; font-weight: 900; padding-top: 50px; color: var(--primary); transition: color 0.2s; position: relative; z-index: 5; }
        .crushed { color: var(--danger) !important; }

        /* রকেট ডিজাইন */
        #rocket-wrapper {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 100px; display: none; flex-direction: column; align-items: center;
        }
        .rocket-body { 
            width: 35px; height: 70px; background: linear-gradient(#f0f6fc, #58a6ff); 
            border-radius: 50% 50% 8px 8px; position: relative; 
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4); 
        }
        .rocket-body::before, .rocket-body::after {
            content: ''; position: absolute; bottom: 5px; width: 12px; height: 25px; background: #3d8bff; z-index: -1;
        }
        .rocket-body::before { left: -8px; border-radius: 5px 0 0 5px; }
        .rocket-body::after { right: -8px; border-radius: 0 5px 5px 0; }

        .exhaust { 
            width: 16px; height: 40px; background: linear-gradient(to bottom, #ffea00, #ff4d4d, transparent); 
            filter: blur(2px); animation: fire 0.1s infinite alternate; margin-top: -2px;
        }

        @keyframes fire { from { transform: scaleY(1); opacity: 1; } to { transform: scaleY(1.6); opacity: 0.7; } }

        .controls { margin-top: 25px; }
        .btn { width: 100%; padding: 18px; font-size: 19px; font-weight: bold; border-radius: 16px; border: none; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-start { background: var(--success); color: #0d1117; box-shadow: 0 5px 0 #1a6328; }
        .btn-cashout { background: var(--gold); color: black; box-shadow: 0 5px 0 #c2b02a; }
        .btn:disabled { background: #30363d; color: #8b949e; box-shadow: none; cursor: not-allowed; }
        .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="balance-bar">
        <span> 💎<span id="coins">0</span></span>
        <span>🪙 <span id="iq">0</span></span>
    </div>

    <div id="game-window">
        <div id="multiplier">1.00x</div>
        <div id="rocket-wrapper">
            <div class="rocket-body"></div>
            <div class="exhaust"></div>
        </div>
    </div>

    <div class="controls">
        <button id="actionBtn" class="btn btn-start" onclick="handleAction()">গেম শুরু (২০ টাকা)</button>
    </div>
</div>

<script>
    // LocalStorage Data
    let localUser = JSON.parse(localStorage.getItem('user')) || { coins: 500, iq_balance: 0, messages: [] };
    let score = 1.00;
    let target = 0;
    let gameLoop;
    let isActive = false;
    let hasCashedOut = false;
    let currentSpeed = 100;

    function refreshUI() {
        document.getElementById('coins').innerText = localUser.coins;
        document.getElementById('iq').innerText = localUser.iq_balance;
    }

    function handleAction() {
        if (!isActive) startFlight(); else cashOut();
    }

    function startFlight() {
        if (localUser.coins < 20) return alert("টাকা নেই!");

        // Initial Reset
        isActive = true;
        hasCashedOut = false;
        score = 1.00;
        currentSpeed = 100;
        
        // UI Reset
        const multDisplay = document.getElementById('multiplier');
        const rocket = document.getElementById('rocket-wrapper');
        const btn = document.getElementById('actionBtn');
        
        multDisplay.innerText = "1.00x";
        multDisplay.classList.remove('crushed');
        rocket.style.display = 'flex';
        rocket.style.bottom = '20px';
        btn.innerText = "টাকা তুলে নিন!";
        btn.className = "btn btn-cashout";

        // ব্যালেন্স কাটা
        localUser.coins -= 20;
        saveData();
        refreshUI();

        // Target Logic
        let luck = Math.random() * 1000;
        if (luck <= 5) target = 15.00;
        else if (luck <= 150) target = (Math.random() * (4.0 - 2.5) + 2.5).toFixed(2);
        else if (luck <= 650) target = (Math.random() * (1.9 - 1.4) + 1.4).toFixed(2);
        else target = (Math.random() * (1.3 - 1.1) + 1.1).toFixed(2);

        runGame();
    }

    function runGame() {
        if (!isActive) return;

        gameLoop = setTimeout(() => {
            // মাল্টিপ্লায়ার বৃদ্ধি
            score += 0.01;
            document.getElementById('multiplier').innerText = score.toFixed(2) + "x";

            // রকেট পজিশন (স্মুথলি উপরে ওঠা)
            const rocket = document.getElementById('rocket-wrapper');
            let height = 20 + (score - 1) * 75;
            if (height < 280) rocket.style.bottom = height + "px";

            // গতির পরিবর্তন (সময়ের সাথে গতি বাড়বে)
            if (currentSpeed > 15) currentSpeed -= 0.2;

            if (score >= target) {
                crash();
            } else {
                runGame();
            }
        }, currentSpeed);
    }

    function cashOut() {
        if (!isActive || hasCashedOut) return;
        
        hasCashedOut = true;
        isActive = false;
        clearTimeout(gameLoop);

        let winAmount = Math.floor(20 * score);
        localUser.coins += winAmount;
        
        alert(`জিতেছেন! ${winAmount} টাকা`);
        saveMessage(`রকেট জয়: ${score.toFixed(2)}x এ তুলেছেন।`);
        saveData();
        resetGame();
    }

    function crash() {
        isActive = false;
        clearTimeout(gameLoop);

        const multDisplay = document.getElementById('multiplier');
        multDisplay.innerText = "CRASHED!";
        multDisplay.classList.add('crushed');
        document.getElementById('rocket-wrapper').style.display = 'none';
        
        document.getElementById('actionBtn').disabled = true;
        
        saveMessage(`রকেট লস: ${score.toFixed(2)}x এ ক্রাশ।`);
        saveData();

        setTimeout(() => {
            document.getElementById('actionBtn').disabled = false;
            resetGame();
        }, 2000);
    }

    function resetGame() {
        isActive = false;
        const btn = document.getElementById('actionBtn');
        btn.innerText = "গেম শুরু (২০ টাকা)";
        btn.className = "btn btn-start";
        document.getElementById('multiplier').innerText = "1.00x"; // অটো রিসেট
        document.getElementById('multiplier').classList.remove('crushed');
        refreshUI();
    }

    function saveData() { localStorage.setItem('user', JSON.stringify(localUser)); }

    function saveMessage(msg) {
        if(!localUser.messages) localUser.messages = [];
        localUser.messages.unshift({ title: "Rocket", body: msg, time: new Date().toLocaleTimeString(), isRead: false });
        saveData();
    }

    refreshUI();
</script>
</body>
</html>
