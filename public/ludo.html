<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zfox Ludo - Smart AI vs Player</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .header { padding: 15px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        
        /* লুডু বোর্ড ডিজাইন */
        #ludo-container { position: relative; width: 350px; height: 350px; margin: 20px auto; background: white; border: 5px solid #58a6ff; border-radius: 10px; box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); }
        .board-img { width: 100%; height: 100%; display: block; }
        
        /* গুটি (Tokens) */
        .token { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #000; transition: all 0.3s ease; z-index: 10; transform: translate(-50%, -50%); }
        .user-token { background: #ff4500; box-shadow: 0 0 5px #ff4500; }
        .ai-token { background: #1f6feb; box-shadow: 0 0 5px #1f6feb; }

        /* কন্ট্রোল */
        .controls { margin-top: 20px; }
        .dice-box { width: 65px; height: 65px; background: white; color: black; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; border: 4px solid #58a6ff; cursor: pointer; }
        .btn-start { background: linear-gradient(45deg, #238636, #2ea043); color: white; border: none; padding: 15px 35px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; }
        .status-text { margin-top: 15px; color: #8b949e; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <span style="color: #58a6ff; font-weight: 800; font-size: 20px;">Zfox Ludo 🎲</span>
        <span id="coin-display" style="color: #ffcc00; font-weight: bold;">🪙 Loading...</span>
    </div>

    <div id="ludo-container">
        <img src="https://i.ibb.co/Ld8yLp3/ludo-board.png" class="board-img">
        <div id="tokens-layer"></div>
    </div>

    <div class="controls">
        <div id="pre-game">
            <button class="btn-start" onclick="startLudoProcess()">Start Game (Entry: 20 🪙)</button>
        </div>
        
        <div id="play-zone" style="display: none;">
            <div id="diceDisplay" class="dice-box" onclick="rollUserDice()">?</div>
            <p class="status-text" id="gameStatus">আপনার চালের জন্য ডাইসে চাপ দিন</p>
        </div>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        let isMoving = false;
        let userTurn = true;

        // ইউজারের কয়েন আপডেট করা
        if(user) document.getElementById('coin-display').innerText = `🪙 ${user.coins}`;

        // ১. গেম শুরু করার এপিআই কল (Coin Cut)
        async function startLudoProcess() {
            if(!user) return alert("লগইন করুন!");
            
            try {
                const res = await fetch('/api/ludo-start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: user.gameId, fee: 20 })
                });
                const data = await res.json();

                if(res.ok) {
                    document.getElementById('pre-game').style.display = 'none';
                    document.getElementById('play-zone').style.display = 'block';
                    document.getElementById('gameStatus').innerText = "খেলা শুরু! আপনার চাল দিন।";
                } else {
                    alert(data.message);
                }
            } catch (e) { alert("Server connection failed!"); }
        }

        // ২. ইউজারের চাল (Dice Roll)
        function rollUserDice() {
            if(!userTurn || isMoving) return;
            
            const roll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceDisplay').innerText = roll;
            userTurn = false;
            document.getElementById('gameStatus').innerText = `আপনি পেয়েছেন ${roll}! AI চাল দিচ্ছে...`;

            // ৩. স্মার্ট AI লজিক কল (Priority Move)
            setTimeout(() => smartAIMove(), 1500);
        }

        // ৪. স্মার্ট AI লজিক (বুদ্ধিমান AI)
        function smartAIMove() {
            const aiRoll = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceDisplay').innerText = aiRoll;

            /* স্মার্ট AI লজিক হুক:
               ১. চেক করবে aiRoll দিয়ে ইউজারের গুটি কাটা যায় কি না (Priority 1)
               ২. না হলে চেক করবে নিজের গুটি ঘরে ঢোকানো যায় কি না (Priority 2)
               ৩. সবশেষে রেন্ডম মুভ।
            */
            
            document.getElementById('gameStatus').innerText = `AI পেয়েছে ${aiRoll}! এখন আপনার চাল।`;
            userTurn = true;
            
            // চেক করা কেউ জিতেছে কি না
            // checkWinner();
        }

        // ৫. জিতলে কয়েন অ্যাড করার ফাংশন
        async function claimReward() {
            try {
                const res = await fetch('/api/ludo-end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        gameId: user.gameId, 
                        reward: 40, // ২০ দিয়ে খেললে ৪০ পাবে
                        secretToken: "ZFOX_LUDO_VERIFIED"
                    })
                });
                if(res.ok) {
                    alert("বিজয়ল্লাস! ৪০ কয়েন আপনার ওয়ালেটে যোগ হয়েছে। 🏆");
                    window.location.href = 'home.html';
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
