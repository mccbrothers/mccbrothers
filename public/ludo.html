<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zfox Ludo - Smart AI</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: sans-serif; text-align: center; margin: 0; overflow-x: hidden; }
        .header { padding: 15px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        
        /* লুডু বোর্ড ডিজাইন */
        #ludo-container { position: relative; width: 350px; height: 350px; margin: 20px auto; background: #fff; border: 5px solid #58a6ff; border-radius: 10px; box-shadow: 0 0 20px rgba(88, 166, 255, 0.3); }
        .board-img { width: 100%; height: 100%; display: block; }
        
        /* কন্ট্রোল প্যানেল */
        .controls { margin-top: 20px; padding: 10px; }
        .dice-box { width: 60px; height: 60px; background: white; color: black; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; border: 3px solid #58a6ff; cursor: pointer; transition: transform 0.2s; }
        .dice-box:active { transform: scale(0.9); }
        
        .btn-start { background: linear-gradient(45deg, #238636, #2ea043); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .status { margin-top: 10px; color: #8b949e; font-size: 14px; }
        
        /* গুটি (Tokens) */
        .token { position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #000; transition: all 0.3s ease; }
        .user-token { background: #ff4500; box-shadow: 0 0 5px #ff4500; }
        .ai-token { background: #1f6feb; box-shadow: 0 0 5px #1f6feb; }
    </style>
</head>
<body>

    <div class="header">
        <span style="color: #58a6ff; font-weight: bold;">Zfox Ludo 🎲</span>
        <span id="coin-display" style="color: #ffcc00;">🪙 Loading...</span>
    </div>

    <div id="ludo-container">
        <img src="https://i.ibb.co/Ld8yLp3/ludo-board.png" class="board-img" alt="Ludo Board">
        
        <div id="tokens-layer"></div>
    </div>

    <div class="controls">
        <div id="game-info">
            <button class="btn-start" id="startBtn" onclick="initGame()">Start Game (Entry: 20 🪙)</button>
        </div>
        
        <div id="play-zone" style="display: none;">
            <div id="diceResult" class="dice-box" onclick="handleUserRoll()">?</div>
            <p class="status" id="gameStatus">আপনার চালের জন্য ডাইসে ক্লিক করুন</p>
        </div>
    </div>

    <script>
        let user = JSON.parse(sessionStorage.getItem('user'));
        let isGameRunning = false;
        let userTurn = true;
        let diceValue = 0;

        // ইউজারের বর্তমান কয়েন দেখানো
        if(user) document.getElementById('coin-display').innerText = `🪙 ${user.coins}`;

        async function initGame() {
            const entryFee = 20;
            
            // ১. এপিআই কল করে কয়েন কাটা
            try {
                const res = await fetch('/api/ludo-start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: user.gameId, fee: entryFee })
                });
                
                const data = await res.json();
                
                if(res.ok) {
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('play-zone').style.display = 'block';
                    isGameRunning = true;
                    document.getElementById('gameStatus').innerText = "গেম শুরু হয়েছে! আপনার চাল...";
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert("সার্ভার কানেকশন এরর!");
            }
        }

        function handleUserRoll() {
            if(!isGameRunning || !userTurn) return;
            
            diceValue = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceResult').innerText = diceValue;
            userTurn = false;
            
            document.getElementById('gameStatus').innerText = `আপনি পেয়েছেন ${diceValue}! AI চাল দিচ্ছে...`;
            
            // ২. ১ সেকেন্ড পর AI চাল দিবে (বুদ্ধিমান লজিক)
            setTimeout(handleAIRoll, 1200);
        }

        function handleAIRoll() {
            let aiDice = Math.floor(Math.random() * 6) + 1;
            
            // --- স্মার্ট AI লজিক (Priority) ---
            // এখানে এমন কোড থাকবে যা চেক করবে AI কি ইউজারকে কাটতে পারবে?
            // যদি aiDice দিয়ে ইউজারের কোনো গুটি কাটা যায়, তবে AI সেই চালটাই দিবে।
            
            document.getElementById('diceResult').innerText = aiDice;
            document.getElementById('gameStatus').innerText = `AI পেয়েছে ${aiDice}! এখন আপনার চাল...`;
            userTurn = true;
            
            // এখানে গেম শেষ হওয়ার লজিক চেক করতে হবে
        }

        // গেম শেষে এই ফাংশনটি কল হবে
        async function endGame(winner) {
            isGameRunning = false;
            if(winner === 'user') {
                alert("আপনি জিতেছেন! 🏆");
                // api/ludo-end.js কল করে কয়েন অ্যাড করতে হবে
            } else {
                alert("AI জিতে গেছে! চেষ্টা চালিয়ে যান। 🌚");
            }
            location.reload();
        }

    </script>
</body>
  </html>
