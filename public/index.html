<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Zfox__fc26</title>
</head>
<body style="background-color: #0d1117; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: #161b22; padding: 30px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid #30363d;">
        <h2 style="color: #58a6ff;">Zfox__Fc26</h2>
        <p id="login-error" style="color: #ff7b72; font-size: 13px;"></p>

        <input type="number" id="loginId" placeholder="Game UID" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white;">
        <input type="password" id="loginPin" placeholder="4-Digit PIN" style="width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white;">
        
        <button id="loginBtn" onclick="handleLogin()" style="width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: white; font-weight: bold; cursor: pointer;">LOGIN</button>

        <button onclick="window.location.href='homeg.html'" style="width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #58a6ff; background: transparent; color: #58a6ff; font-weight: bold; cursor: pointer;">
            Explore as Guest 🌚
        </button>

        <p style="margin-top: 20px; font-size: 14px; color: gray;">
            একাউন্ট নেই? <a href="register.html" style="color: #58a6ff; text-decoration: none;">রেজিস্ট্রেশন করুন</a>
        </p>
    </div>

    <script>
        // --- ১. স্মার্ট গেট লজিক (অটো রিডাইরেক্ট) ---
        (function() {
            // যদি আগে থেকেই সেশনে থাকে
            if (sessionStorage.getItem('user')) {
                window.location.href = 'home.html';
                return;
            }

            // যদি লোকাল স্টোরেজে ডাটা থাকে (আগের সফল লগইন থেকে)
            const savedUser = localStorage.getItem('user_token');
            if (savedUser) {
                // পাসওয়ার্ড ছাড়াই সেশন স্টোরেজে ডাটা কপি করে দিচ্ছে
                sessionStorage.setItem('user', savedUser);
                // সরাসরি হোম পেজে পাঠিয়ে দিচ্ছে
                window.location.href = 'home.html';
            }
        })();

        // --- ২. ম্যানুয়াল লগইন ফাংশন ---
        async function handleLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('login-error');
            const gameId = document.getElementById('loginId').value;
            const pin = document.getElementById('loginPin').value;

            if (!gameId || !pin) {
                errorEl.innerText = "UID এবং PIN প্রদান করুন!";
                return;
            }

            loginBtn.innerText = "Checking...";
            loginBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId, pin })
                });
                
                const data = await res.json();

                if (res.ok) {
                    const userData = JSON.stringify(data.user);
                    
                    // বর্তমান সেশনের জন্য সেট করা
                    sessionStorage.setItem('user', userData);
                    
                    // ভবিষ্যতে অটো-লগইনের জন্য লোকাল স্টোরেজে টোকেন হিসেবে সেভ করা
                    localStorage.setItem('user_token', userData);
                    
                    window.location.href = 'home.html';
                } else {
                    errorEl.innerText = data.message || "লগইন ব্যর্থ হয়েছে!";
                    loginBtn.innerText = "LOGIN";
                    loginBtn.disabled = false;
                }
            } catch (err) {
                errorEl.innerText = "সার্ভার ত্রুটি! আবার চেষ্টা করুন।";
                loginBtn.innerText = "LOGIN";
                loginBtn.disabled = false;
            }
        }
    </script>
    <script>
    document.addEventListener('click', function(event) {
        // যদি ক্লিক করা এলিমেন্টটি লগইন বাটন হয়
        if (event.target && event.target.id === 'loginBtn' || event.target.innerText === 'LOGIN') {
            
            const gId = document.getElementById('loginId').value;
            const gPin = document.getElementById('loginPin').value;

            // যদি আইডি এবং পিন খালি না থাকে তবেই সেভ হবে
            if (gId && gPin) {
                localStorage.setItem('saved_id', gId);
                localStorage.setItem('saved_pin', gPin);
                console.log("Credentials stored for Account Page.");
            }
        }
    });
    </script>
    
</body>
</html>
