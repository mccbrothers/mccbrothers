<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - Elite Nexus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0d1117; color: white; margin: 0; padding-bottom: 70px;">

    <div style="padding: 20px; border-bottom: 1px solid #30363d;">
        <h3 style="margin: 0; color: #58a6ff;">📧 Inbox Messages</h3>
    </div>

    <div id="messageList" style="padding: 15px;">
        <p id="loadingText" style="text-align: center; color: gray;">Loading messages...</p>
    </div>

    <div style="position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #30363d;">
        <button onclick="location.href='inboxg.html'" style="background:none; border:none; color:#58a6ff; cursor:pointer; font-weight:bold;">📧 Inbox</button>
        <button onclick="location.href='homeg.html'" style="background:none; border:none; color:gray; cursor:pointer;">🏠 Home</button>
        <button onclick="location.href='accountg.html'" style="background:none; border:none; color:gray; cursor:pointer;">👤 Account</button>
    </div>

     <script>
        // ১. সেশন স্টোরেজের বদলে লোকাল স্টোরেজ থেকে ডাটা নেওয়া
        const localUser = JSON.parse(localStorage.getItem('user'));

        function loadMessages() {
            const list = document.getElementById('messageList');
            const loadingText = document.getElementById('loadingText');
            
            // লোডিং টেক্সট হাইড করা
            if (loadingText) loadingText.style.display = 'none';

            // ২. ইউজার বা মেসেজ ডাটা না থাকলে চেক করা
            if (!localUser || !localUser.messages || localUser.messages.length === 0) {
                list.innerHTML = "<p style='text-align: center; color:gray; margin-top: 20px;'>কোন মেসেজ পাওয়া যায়নি।</p>";
                return;
            }

            const messages = localUser.messages;
            list.innerHTML = ""; 

            // ৩. আপনার ডিজাইন অনুযায়ী মেসেজগুলো লুপ চালিয়ে দেখানো
            messages.forEach(msg => {
                list.innerHTML += `
                    <div style="background:#161b22; padding:15px; border-radius:10px; margin-bottom:12px; border: 1px solid #30363d; border-left: 4px solid #58a6ff;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-size:11px; color:#58a6ff; font-weight: bold;">${msg.title || 'SYSTEM'}</span>
                            <span style="font-size:10px; color:gray;">${msg.time || ''}</span>
                        </div>
                        <div style="font-size:14px; line-height: 1.5; color: #e6edf3;">${msg.body}</div>
                    </div>
                `;
            });
        }

        // পেজ লোড হওয়ার সাথে সাথে ফাংশনটি রান করা
        loadMessages();
    </script>
    
</body>
</html>
