<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Pro - Zfox_fc</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 10px; background: #161b22; padding: 15px; border-radius: 15px; border: 1px solid #30363d; margin: 20px auto; width: max-content; }
        .cell { width: 60px; height: 60px; background: #21262d; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 8px; border: 1px solid #30363d; transition: 0.2s; }
        .cell:hover { background: #30363d; }
        .revealed { background: #0d1117 !important; cursor: default; border: 1px solid #58a6ff; }
        .bomb { background: #f85149 !important; }
        #setup input { padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: white; width: 150px; margin-bottom: 10px; }
        .btn { padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-start { background: linear-gradient(45deg, #238636, #2ea043); color: white; }
        .btn-cashout { background: linear-gradient(45deg, #58a6ff, #00d2fc); color: white; margin-top: 20px; }
    </style>
</head>
<body>

    <script>
        // রিডাইরেক্ট চেক: যদি ইউজার লগইন না থাকে
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user || !user.gameId) {
            window.location.href = 'index.html';
        }
    </script>

    <h2 style="color: #58a6ff;">💣 Minesweeper Pro</h2>
    
    <div id="setup">
        <p>আপনার বেট এমাউন্ট লিখুন (মিনিমাম ৫ 🪙)</p>
        <input type="number" id="betInput" min="5" placeholder="এমাউন্ট দিন"> <br>
        <button class="btn btn-start" onclick="startPay()">গেম শুরু করুন</button>
    </div>

    <div id="gameArea" style="display:none;">
        <div style="background: #161b22; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #58a6ff;">
            <h3 style="margin: 0;">চলতি লাভ: <span id="currentWin" style="color: #ffcc00;">0</span> 🪙</h3>
        </div>
        <div class="grid" id="grid"></div>
        <button id="cashoutBtn" class="btn btn-cashout" onclick="cashOut()">কয়েন আউট (Cash Out)</button>
    </div>

    <script>
        let bombPos, bet, earned = 0, revealedCount = 0;
        let isGameOver = false;

        async function startPay() {
            const betInput = document.getElementById('betInput');
            bet = parseInt(betInput.value);

            if (isNaN(bet) || bet < 5) {
                alert("অনুগ্রহ করে সঠিক এমাউন্ট দিন (সর্বনিম্ন ৫)");
                return;
            }

            try {
                const res = await fetch('/api/game', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        gameId: user.gameId, 
                        betAmount: bet, 
                        userName: user.name 
                    })
                });
                
                const data = await res.json();
                
                if(data.success) {
                    bombPos = data.bombLocation;
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('gameArea').style.display = 'block';
                    createGrid();
                } else { 
                    alert(data.message || "আপনার পর্যাপ্ত কয়েন নেই!"); 
                }
            } catch (err) {
                alert("সার্ভার ত্রুটি! আবার চেষ্টা করুন।");
            }
        }

        function createGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => reveal(i, cell);
                grid.appendChild(cell);
            }
        }

        function reveal(i, el) {
            if(isGameOver || el.classList.contains('revealed')) return;

            if(i === bombPos) {
                isGameOver = true;
                el.innerHTML = '💣';
                el.classList.add('revealed', 'bomb');
                alert('বোমা ফেটেছে! আপনি হেরেছেন।');
                finishGame('Boomed', 0);
            } else {
                el.classList.add('revealed');
                el.innerHTML = '🪙';
                revealedCount++;
                // প্রফিট ক্যালকুলেশন (বেট এর ৯০% কে ২৪ দিয়ে ভাগ করে প্রতিটি ক্লিকের জন্য)
                earned = (bet * 0.90 / 24) * revealedCount;
                document.getElementById('currentWin').innerText = earned.toFixed(2);
            }
        }

        async function cashOut() {
            if(isGameOver) return;
            isGameOver = true;
            const finalWin = parseFloat(earned) + parseInt(bet);
            finishGame('Cashed Out', finalWin);
        }

        async function finishGame(status, finalAmount) {
            try {
                await fetch('/api/game-finish', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        gameId: user.gameId, 
                        amount: finalAmount, 
                        status: status,
                        bet: bet,
                        userName: user.name
                    })
                });
                window.location.href = 'home.html';
            } catch (e) {
                console.error("Error saving game:", e);
                window.location.href = 'home.html';
            }
        }
    </script>
</body>
</html>
