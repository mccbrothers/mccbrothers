<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minesweeper Pro</title>
    <style>
        /* আপনার আগের স্টাইলগুলো এখানে থাকবে */
        .grid { display: grid; grid-template-columns: repeat(5, 60px); gap: 10px; background: #0f3460; padding: 15px; border-radius: 10px; }
        .cell { width: 60px; height: 60px; background: #e94560; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 5px; }
        .revealed { background: #16213e; cursor: default; }
    </style>
</head>
<body>
    <div id="setup">
        <input type="number" id="betInput" min="5" placeholder="টাকার পরিমাণ">
        <button onclick="startPay()">গেম শুরু করুন</button>
    </div>

    <div id="gameArea" style="display:none;">
        <h3>চলতি লাভ: <span id="currentWin">0</span> ৳</h3>
        <div class="grid" id="grid"></div>
        <button id="cashoutBtn" onclick="cashOut()" style="margin-top:20px; background: #00d2fc;">কয়েন আউট (Cash Out)</button>
    </div>

    <script>
        let bombPos, bet, earned = 0, revealedCount = 0;
        const user = JSON.parse(localStorage.getItem('user')); // আপনার সিস্টেমে যেভাবে ইউজার সেভ থাকে

        async function startPay() {
            bet = document.getElementById('betInput').value;
            const res = await fetch('/api/game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ gameId: user.gameId, betAmount: bet, userName: user.name })
            });
            const data = await res.json();
            if(data.success) {
                bombPos = data.bombLocation;
                document.getElementById('setup').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                createGrid();
            } else { alert(data.message); }
        }

        function createGrid() {
            const grid = document.getElementById('grid');
            for(let i=0; i<25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.onclick = () => reveal(i, cell);
                grid.appendChild(cell);
            }
        }

        function reveal(i, el) {
            if(el.classList.contains('revealed')) return;
            if(i === bombPos) {
                el.innerHTML = '💣';
                alert('বোমা ফেটেছে! আপনি হেরেছেন।');
                finishGame('Boomed', 0);
            } else {
                el.classList.add('revealed');
                el.innerHTML = '🪙';
                revealedCount++;
                earned = (bet * 0.90 / 24) * revealedCount;
                document.getElementById('currentWin').innerText = earned.toFixed(2);
            }
        }

        async function cashOut() {
            finishGame('Cashed Out', parseFloat(earned) + parseInt(bet));
        }

        async function finishGame(status, finalAmount) {
            // একবারে ডাটা রাইট করার জন্য এপিআই কল
            await fetch('/api/game-finish', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    gameId: user.gameId, 
                    amount: finalAmount, 
                    status: status,
                    bet: bet,
                    userName: user.name
                })
            });
            window.location.href = 'home.html';
        }
    </script>
</body>
  </html>
