<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Elite Nexus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #0d1117; color: white; margin: 0; padding-bottom: 70px;">

    <div style="background: linear-gradient(to bottom, #161b22, #0d1117); padding: 30px 20px; text-align: center; border-bottom: 1px solid #30363d;">
        <div style="width: 80px; height: 80px; background: #58a6ff; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px;">
            👤
        </div>
        <h2 id="accName" style="margin: 5px 0;">Loading...</h2>
        <p style="color: gray; margin: 0;">UID: <span id="accId">0000</span></p>
        
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <div style="background: #238636; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 13px;">
                Coins: <span id="accCoins">0</span> 💎
            </div>
            <div style="background: #58a6ff; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 13px;">
                IQ: <span id="accIQ">0</span> 🧠
            </div>
        </div>

        <button onclick="logout()" style="display:block; margin: 20px auto 0; background:none; border:1px solid #da3633; color:#da3633; padding:5px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">Logout</button>
    </div>

    <div style="padding: 20px;">
        <h3 style="margin-bottom: 15px; color: #58a6ff;">Purchase History</h3>
        <div id="orderList">
            <p id="loadingText" style="color: gray;">Loading history...</p>
        </div>
    </div>

    <div style="position: fixed; bottom: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #30363d;">
        <button onclick="location.href='inboxg.html'" style="background:none; border:none; color:gray; cursor:pointer;">📧 Inbox</button>
        <button onclick="location.href='homeg.html'" style="background:none; border:none; color:gray; cursor:pointer;">🏠 Home</button>
        <button onclick="location.href='accountg.html'" style="background:none; border:none; color:#58a6ff; cursor:pointer;">👤 Account</button>
    </div>

    <script>
        // ১. লোকাল স্টোরেজ থেকে ডাটা নেওয়া এবং অটো গেস্ট আইডি সিস্টেম
        let localUser = JSON.parse(localStorage.getItem('user'));

        if (!localUser) {
            // যদি আগে থেকে কোনো আইডি না থাকে তবে নতুন গেস্ট তৈরি করবে
            const guestId = Math.floor(100000 + Math.random() * 900000); // ৬ ডিজিটের র‍্যান্ডম আইডি
            localUser = {
                name: "Guest User",
                gameId: guestId,
                coins: 10, // নতুন ইউজারের জন্য কিছু বোনাস দিতে চাইলে
                iq_balance: 5,
                messages: [],
                joinedPackages: []
            };
            localStorage.setItem('user', JSON.stringify(localUser));
        }

        // ২. স্ক্রিনে সব তথ্য আপডেট করা
        function updateProfileUI() {
            document.getElementById('accName').innerText = localUser.name;
            document.getElementById('accId').innerText = localUser.gameId;
            document.getElementById('accCoins').innerText = localUser.coins || 0;
            document.getElementById('accIQ').innerText = localUser.iq_balance || 0;
            
            renderOrders(localUser.joinedPackages || []);
        }

        // ৩. পারচেজ হিস্ট্রি দেখানো
        function renderOrders(orders) {
            const list = document.getElementById('orderList');
            const loadingText = document.getElementById('loadingText');
            if (loadingText) loadingText.style.display = 'none';
            
            list.innerHTML = "";

            if (orders.length === 0) {
                list.innerHTML = "<p style='color:gray;'>No purchases yet.</p>";
                return;
            }

            // নতুন হিস্ট্রিগুলো উপরে দেখানোর জন্য উল্টো করে লুপ চালানো হয়েছে
            [...orders].reverse().forEach(pkgName => {
                list.innerHTML += `
                    <div style="background:#161b22; padding:12px; border-radius:8px; margin-bottom:10px; border: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-weight:bold;">${pkgName}</div>
                            <div style="font-size:11px; color:gray;">Tournament Entry</div>
                        </div>
                        <div style="color: #238636; font-size: 13px;">● Success</div>
                    </div>
                `;
            });
        }

        // ৪. লগআউট ফাংশন
        function logout() {
            if (confirm("লগআউট করলে আপনার সব লোকাল ডাটা মুছে যাবে। আপনি কি নিশ্চিত?")) {
                localStorage.clear();
                location.href = 'index.html';
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে রান করবে
        updateProfileUI();
    </script>
</body>
</html>
