<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার গ্যালারি</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; }
        .content-card { background: #1e1e1e; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .media-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: contain; }
        .play-icon { position: absolute; font-size: 40px; color: rgba(255,255,255,0.8); pointer-events: none; }
        .category-chip { background: #272727; padding: 6px 15px; border-radius: 20px; font-size: 13px; white-space: nowrap; border: 1px solid #3f3f3f; }
        .category-chip.active { background: white; color: black; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="sticky top-0 bg-[#0f0f0f] z-50 p-4 shadow-lg">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-xl font-bold text-red-500"><i class="fas fa-photo-video mr-2"></i>My Media</h1>
            <div class="relative w-2/3">
                <input type="text" id="searchInput" placeholder="নাম দিয়ে খুঁজুন..." 
                       class="w-full bg-[#121212] border border-[#333] rounded-full py-1 px-4 text-sm outline-none focus:border-red-500">
            </div>
        </div>
        
        <div class="flex gap-2 overflow-x-auto no-scrollbar" id="categoryList">
            <div class="category-chip active" onclick="filterData('All')">সব</div>
        </div>
    </header>

    <main class="p-3" id="mediaGrid">
        <div class="text-center py-20">লোড হচ্ছে...</div>
    </main>

    <script>
        const apiURL = "https://sheetdb.io/api/v1/w2yd7d0q3gyvn";
        let allData = [];

        async function loadData() {
            try {
                const res = await fetch(apiURL);
                allData = await res.json();
                renderCategories();
                renderItems(allData);
            } catch (err) {
                document.getElementById('mediaGrid').innerHTML = "ডেটা পাওয়া যায়নি!";
            }
        }

        function renderCategories() {
            const categories = ['All', ...new Set(allData.map(item => item.name))];
            document.getElementById('categoryList').innerHTML = categories.map(cat => `
                <div class="category-chip ${cat==='All'?'active':''}" onclick="filterData('${cat}', this)">${cat === 'All' ? 'সব' : cat}</div>
            `).join('');
        }

        function renderItems(data) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = data.map(item => {
                // ভিডিও চেক করা (যদি ভিডিও কলামে লিংক থাকে)
                const isVideo = item.video && (item.video.includes('mp4') || item.video.includes('youtube') || item.video.includes('drive.google'));
                const displayLink = isVideo ? item.video : item.img;

                return `
                <div class="content-card">
                    <div class="media-container" onclick="openMedia('${displayLink}')">
                        ${isVideo ? 
                            `<video src="${item.video}" poster="${item.img}"></video><i class="fas fa-play-circle play-icon"></i>` : 
                            `<img src="${item.img}" alt="Image">`
                        }
                    </div>
                    <div class="p-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-sm leading-tight">${item.title}</h3>
                                <p class="text-xs text-gray-400 mt-1">${item.description}</p>
                            </div>
                            <span class="text-[10px] bg-red-600 px-2 py-0.5 rounded-full uppercase">${item.name}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterData(name, el) {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            const filtered = (name === 'All') ? allData : allData.filter(d => d.name === name);
            renderItems(filtered);
        }

        // সার্চ ফাংশন
        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allData.filter(d => d.name.toLowerCase().includes(val) || d.title.toLowerCase().includes(val));
            renderItems(filtered);
        };

        // মিডিয়া ওপেন করা (ভিডিও বা ছবি)
        function openMedia(link) {
            window.open(link, '_blank');
        }

        loadData();
    </script>
</body>
</html>
