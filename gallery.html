<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার গ্যালারি | Light Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: #f8fafc; 
            color: #1e293b; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* কার্ডের নতুন ডিজাইন */
        .content-card { 
            background: white; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        
        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* ছবির সাইজ ফিক্স করার মূল সিএসএস */
        .media-container { 
            position: relative; 
            width: 100%; 
            padding-top: 56.25%; /* ১৬:৯ রেশিও */
            background: #e2e8f0; 
            overflow: hidden;
        }
        
        .media-container img, .media-container video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* ছবি অটো ফিট হবে এবং সুন্দর দেখাবে */
            transition: transform 0.5s ease;
        }

        .content-card:hover img {
            transform: scale(1.05);
        }

        .category-chip { 
            background: #ffffff; 
            padding: 8px 18px; 
            border-radius: 50px; 
            font-size: 14px; 
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #e2e8f0;
            color: #64748b;
            white-space: nowrap;
        }

        .category-chip.active { 
            background: #ef4444; 
            color: white; 
            border-color: #ef4444;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="sticky top-0 bg-white/80 backdrop-blur-md z-50 p-4 border-b border-gray-200">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <h1 class="text-2xl font-bold text-red-600 flex items-center">
                <i class="fas fa-th-large mr-2"></i> My Media
            </h1>
            <div class="relative w-full md:w-1/2">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="গ্যালারি থেকে খুঁজুন..." 
                       class="w-full bg-gray-100 border-none rounded-xl py-2.5 pl-11 pr-4 focus:ring-2 focus:ring-red-500 outline-none">
            </div>
        </div>
        
        <div class="flex gap-2 overflow-x-auto no-scrollbar mt-4 max-w-6xl mx-auto py-2" id="categoryList">
            </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="mediaGrid">
            <div class="col-span-full text-center py-20 text-gray-400">লোড হচ্ছে...</div>
        </div>
    </main>

    <script>
        // আপনার নতুন API এবং Sheet3 ট্যাব পাথ
        const apiURL = "https://api.steinhq.com/v1/storages/697e2548affba40a624455bf/Sheet3";
        let allData = [];

        async function loadData() {
            try {
                const res = await fetch(apiURL);
                allData = await res.json();
                renderCategories();
                renderItems(allData);
            } catch (err) {
                document.getElementById('mediaGrid').innerHTML = "ডেটা লোড করা যায়নি!";
            }
        }

        function renderCategories() {
            const categories = ['All', ...new Set(allData.map(item => item.name))];
            document.getElementById('categoryList').innerHTML = categories.map(cat => `
                <div class="category-chip ${cat==='All'?'active':''}" onclick="filterData('${cat}', this)">
                    ${cat === 'All' ? 'সবগুলো' : cat}
                </div>
            `).join('');
        }

        function renderItems(data) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = data.map(item => {
                const isVideo = item.video && (item.video.includes('mp4') || item.video.includes('youtube') || item.video.includes('drive.google'));
                const displayLink = isVideo ? item.video : item.img;

                return `
                <div class="content-card group cursor-pointer" onclick="openMedia('${displayLink}')">
                    <div class="media-container">
                        ${isVideo ? 
                            `<video src="${item.video}" poster="${item.img}"></video>
                             <div class="absolute inset-0 flex items-center justify-center bg-black/10">
                                <i class="fas fa-play-circle text-5xl text-white drop-shadow-lg"></i>
                             </div>` : 
                            `<img src="${item.img}" alt="${item.title}" loading="lazy">`
                        }
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold bg-gray-100 text-gray-600 px-2 py-1 rounded-md uppercase">${item.name}</span>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg leading-snug line-clamp-1 group-hover:text-red-600 transition-colors">${item.title}</h3>
                        <p class="text-sm text-gray-500 mt-1 line-clamp-2">${item.description}</p>
                    </div>
                </div>
                `;
            }).join('');
        }

        function filterData(name, el) {
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            const filtered = (name === 'All') ? allData : allData.filter(d => d.name === name);
            renderItems(filtered);
        }

        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allData.filter(d => 
                (d.name && d.name.toLowerCase().includes(val)) || 
                (d.title && d.title.toLowerCase().includes(val))
            );
            renderItems(filtered);
        };

        function openMedia(link) {
            window.open(link, '_blank');
        }

        loadData();
    </script>
</body>
</html>
