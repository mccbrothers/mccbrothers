<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Mist UI - Mobile Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Verdana', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #000000;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed; 
        }

        .fog-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            filter: blur(5px);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            will-change: transform;
        }

        .organic-glass {
            width: 80vw;
            height: 40vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            border-radius: 60% 40% 70% 30% / 40% 50% 60% 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            animation: floatBody 5s ease-in-out infinite;
            z-index: 10;
        }

        .organic-glass img {
            width: 95%;
            height: 95%;
            object-fit: cover;
            border-radius: 50% 50% 40% 60%;
            filter: grayscale(100%);
            pointer-events: none;
        }

        .love-msg {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 5px;
            text-transform: uppercase;
            z-index: 10;
            text-align: center;
        }

        /* নতুন এডেড স্টাইল */
        .footer-credit {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 10;
        }

        @keyframes floatBody {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fall {
            from { transform: translateY(-100px); }
            to { transform: translateY(110vh); }
        }
    </style>
</head>
<body>

    <div class="organic-glass" id="mainBox">
        <img src="https://i.postimg.cc/J4rnFXNk/istockphoto-155376086-612x612.jpg" alt="B&W Image">
    </div>

    <div class="love-msg">Fuck you bro 🙂🙏</div>

    <div class="footer-credit">powered by Adnan Sami ©</div>

    <script>
        function createFog() {
            const particle = document.createElement('div');
            particle.classList.add('fog-particle');
            
            const size = Math.random() * 40 + 20 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            particle.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 4 + 4 + 's';
            particle.style.animation = `fall ${duration}s linear forwards`;

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 8000);
        }

        setInterval(createFog, 1000);

        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('gesturestart', function (event) {
            event.preventDefault();
        });

        const box = document.getElementById('mainBox');
        box.addEventListener('touchstart', () => {
            box.style.transform = 'scale(0.98)';
        });
        box.addEventListener('touchend', () => {
            box.style.transform = 'scale(1)';
        });
    </script>
</body>
  </html>
