<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রজেক্ট ডাটা মনিটর - লেটেস্ট ডাটা ফাস্ট</title>
    <style>
        :root { --primary: #7928ca; --secondary: #ff0080; --bg: #0b0f1a; --card: #161b22; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 30px; }
        h2 { background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
        .container { width: 100%; max-width: 1100px; background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #21262d; padding: 15px; font-size: 14px; text-transform: uppercase; color: #8b949e; border-bottom: 2px solid #30363d; }
        td { padding: 15px; border-bottom: 1px solid #30363d; font-size: 14px; color: #c9d1d9; }
        tr:nth-child(1) td { border-left: 4px solid var(--secondary); background: rgba(255, 0, 128, 0.05); } /* নতুন ডাটা হাইলাইট */
        .img-box { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid #444; }
        .badge { background: #238636; color: white; padding: 4px 8px; border-radius: 5px; font-size: 12px; }
        .refresh-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>📊 লাইভ ইউজার মনিটর</h2>
        <p style="color: #8b949e;">নতুন ডাটা সবার উপরে দেখাবে</p>
    </div>

    <button class="refresh-btn" onclick="loadSheetData()">🔄 রিফ্রেশ করুন</button>

    <div class="container">
        <table>
            <thead>
                <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center;">ডাটা লোড হচ্ছে...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SHEET_ID = '1l_P0T1okUtFiiewiMZyZm6PFLWX5TIBNzGOg-LWK238';
        const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet9`;

        async function loadSheetData() {
            const headRow = document.getElementById('tableHead');
            const bodyRow = document.getElementById('tableBody');

            try {
                const response = await fetch(URL);
                const csvText = await response.text();
                
                let rows = csvText.split('\n').map(row => 
                    row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, ''))
                );

                if (rows.length < 1) return;

                const headers = rows[0];
                const dyIndex = headers.findIndex(h => h.toLowerCase() === 'dy');

                // হেডার সেট করা
                headRow.innerHTML = headers
                    .map((h, index) => index === dyIndex ? '' : `<th>${h}</th>`)
                    .join('');

                // ডাটা সর্টিং: হেডার বাদে বাকি ডাটাগুলোকে উল্টে (Reverse) দেওয়া
                const dataRows = rows.slice(1).filter(r => r.length > 1).reverse();

                bodyRow.innerHTML = "";
                dataRows.forEach(rowData => {
                    const tr = document.createElement('tr');
                    rowData.forEach((cell, index) => {
                        if (index !== dyIndex) {
                            const td = document.createElement('td');
                            if (cell.includes('http')) {
                                td.innerHTML = `<a href="${cell}" target="_blank"><img src="${cell}" class="img-box"></a>`;
                            } else if (cell.includes(',')) {
                                td.innerHTML = `<span class="badge">📍 ${cell}</span>`;
                            } else {
                                td.innerText = cell || "N/A";
                            }
                            tr.appendChild(td);
                        }
                    });
                    bodyRow.appendChild(tr);
                });

            } catch (error) {
                console.error("Error:", error);
                bodyRow.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>ডাটা লোড করতে সমস্যা হয়েছে!</td></tr>";
            }
        }

        loadSheetData();
        setInterval(loadSheetData, 20000); // ২০ সেকেন্ড পর পর অটো আপডেট
    </script>
</body>
</html>
